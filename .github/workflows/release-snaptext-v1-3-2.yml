name: Publish SnapText v1.3.2 fixed update flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-snaptext-v1-3-2.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPTEXT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SNAPTEXT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SNAPTEXT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing release signing secrets." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snaptext-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/snaptext-upload.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease -PappVersionName="1.3.2" -PappVersionCode="1003002"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Name release APK
        run: cp app/build/outputs/apk/release/app-release.apk "SnapText-1.3.2.apk"

      - name: Publish GitHub Release and APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: SnapText v1.3.2
          generate_release_notes: true
          files: SnapText-1.3.2.apk
